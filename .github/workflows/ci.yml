name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so an advisory published against unchanged lockfiles is reported.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: git -c core.quotepath=off ls-files | bash scripts/check-no-personal-data.sh

  api-matrix:
    name: api (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest -q

  # Keeps the required check name `api` stable for branch protection across the matrix legs.
  api:
    needs: api-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every api-matrix leg succeeded
        run: test "${{ needs.api-matrix.result }}" = success

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --run
      - run: pnpm build

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: uv sync --locked
        working-directory: apps/api
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: uv run python -m nosolear.api.export_openapi > ../web/src/shared/api/openapi.json
        working-directory: apps/api
      - run: pnpm --dir apps/web gen:api
      - run: git diff --exit-code

  audit-matrix:
    name: audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      # A vulnerability with no fixed version may be waived only with --ignore-vuln <ID> and a
      # comment naming the advisory and the reason.
      - run: |
          uv export --locked --no-emit-project --all-extras --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx --from pip-audit==2.10.1 pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip
        working-directory: apps/api
      - uses: pnpm/action-setup@v6
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        working-directory: apps/web
      # Waivers live in apps/web/pnpm-workspace.yaml (auditConfig.ignoreGhsas), each with a reason.
      - run: pnpm audit --audit-level=moderate
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        working-directory: apps/web

  # Keeps the required check name `audit` stable for branch protection across the matrix legs.
  audit:
    needs: audit-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every audit-matrix leg succeeded
        run: test "${{ needs.audit-matrix.result }}" = success
