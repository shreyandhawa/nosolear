[project]
name = "nosolear"
version = "0.1.0"
description = "Nosolear API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.162.4",
    "uvicorn==0.54.0",
    "pydantic-settings==2.16.2",
    "scipy==1.18.1",
    "sqlalchemy==2.1.8",
    "alembic==1.20.1",
]

[project.scripts]
nosolear = "nosolear.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "hypothesis==6.170.15",
    "ruff==0.17.4",
    "pyright==1.1.414",
    "httpx==0.28.1",
    "scipy-stubs==1.18.1.1",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# IPA symbols used by the taxonomy that look like Latin letters.
allowed-confusables = ["ɪ", "ɑ"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
strict = ["src"]
extraPaths = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not live'"
markers = ["live: calls real Azure or Claude, or loads real local models; run with make test-live"]
pythonpath = ["tests"]
filterwarnings = [
    # Revisit: httpx pinned at 0.28.1; drop this once starlette's testclient dependency is resolved.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
