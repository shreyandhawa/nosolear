[project]
name = "nosolear"
version = "0.1.0"
description = "Nosolear API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.162.4",
    "uvicorn==0.54.0",
    "pydantic-settings==2.16.2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "hypothesis==6.170.15",
    "ruff==0.17.4",
    "pyright==1.1.414",
    "httpx==0.28.1",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
strict = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
