[project]
name = "nosolear"
version = "0.1.0"
description = "Nosolear API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.162.4",
    "uvicorn==0.54.0",
    "pydantic-settings==2.16.2",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "sqlalchemy==2.1.8",
    "alembic==1.20.1",
    "httpx==0.28.1",
    "azure-cognitiveservices-speech==1.53.0",
    "anthropic==2.8.0",
]

[project.optional-dependencies]
# Heavy on-machine models, imported lazily (see adapters/local_env.py). Base installs never need them.
local = [
    "torch==2.15.0",
    "transformers==5.22.2",
    "huggingface-hub==2.4.0",
    "safetensors==0.8.0",
    "faster-whisper==1.2.1",
]
apple = [
    "huggingface-hub==2.4.0",
    "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
nosolear = "nosolear.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "hypothesis==6.170.15",
    "ruff==0.17.4",
    "pyright==1.1.414",
    "scipy-stubs==1.18.1.1",
    "httpx2==2.16.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# IPA symbols used by the taxonomy and the phone map that look like Latin letters or punctuation.
allowed-confusables = ["ɪ", "ɑ", "ɡ", "ː", "ˈ", "ˌ", "ʔ"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
strict = ["src"]
extraPaths = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not live and not local_models'"
markers = [
    "live: calls real Azure or Claude, or loads real local models; run with make test-live",
    "local_models: needs the local/apple extras and espeak-ng; run with make test-local-models",
]
pythonpath = ["tests"]
filterwarnings = [
    # Revisit: httpx pinned at 0.28.1; drop this once starlette's testclient dependency is resolved.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
