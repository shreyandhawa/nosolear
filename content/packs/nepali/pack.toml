id = "nepali"
name = "Nepali"
description = "Guesses for a Nepali speaker aiming at General American. Nepali has no /f/, /z/, /θ/ or /ð/, one v-w-like sound, one sibilant where English has /s/ and /ʃ/, dental and retroflex stops, and no articles."

[[hypotheses]]
key = "sound.sub.v.w"
reason = "Nepali has one v-w-like sound, so /v/ can come out as /w/."

[[hypotheses]]
key = "sound.sub.w.v"
reason = "Nepali has one v-w-like sound, so /w/ can come out as /v/."

[[hypotheses]]
key = "sound.sub.f.p"
reason = "Nepali has no /f/, so it is often replaced by /p/."

[[hypotheses]]
key = "sound.sub.ʃ.s"
reason = "Nepali has one sibilant where English has /s/ and /ʃ/, so sh can come out as s."

[[hypotheses]]
key = "sound.sub.s.ʃ"
reason = "Nepali has one sibilant where English has /s/ and /ʃ/, so s can come out as sh."

[[hypotheses]]
key = "sound.sub.θ.t"
reason = "Nepali has no /θ/, so it is often replaced by /t/."

[[hypotheses]]
key = "sound.sub.z.dʒ"
reason = "Nepali has no /z/, so it can come out as a j sound."

[[hypotheses]]
key = "sound.sub.z.s"
