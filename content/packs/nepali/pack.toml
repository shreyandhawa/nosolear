key = "sound.ins.epenthesis_sC"
reason = "A vowel is often inserted before an s-cluster, as in ischool."

[[hypotheses]]
key = "prosody.word_stress"
reason = "Syllable-timed rhythm can put word stress on the wrong syllable."

[[hypotheses]]
key = "prosody.unexpected_break"
