[[hypotheses]]
key = "sound.sub.ð.d"
reason = "Nepali has no /ð/, so it is often replaced by /d/."

[[hypotheses]]
key = "sound.sub.ʒ.dʒ"
reason = "Nepali has no /ʒ/, so it can come out as a j sound."

